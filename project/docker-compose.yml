version: '3.8'

services:
  api:
    build: .
    container_name: sih_sih26142_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PROBLEM_ID=SIH26142
    restart: unless-stopped

  web_preview:
    image: nginx:alpine
    container_name: sih_sih26142_web
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sih_sih26142_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgis:
    image: postgis/postgis:16-3.4
    container_name: sih_sih26142_postgis
    environment:
      POSTGRES_USER: srm
      POSTGRES_PASSWORD: srm_ntro_2026
      POSTGRES_DB: sih26142_geospatial
    ports:
      - "5432:5432"
    restart: unless-stopped
